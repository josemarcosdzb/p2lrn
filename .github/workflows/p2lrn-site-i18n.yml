name: P2LRN Bilingual Website
# The generated translation cache is versioned but does not retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      # Only authored source files actually read by the Spanish-to-English generator.
      # SEO/build scripts, styles, binaries, and generated /en pages are not translation inputs.
      - 'deploy/netlify/site/index.html'
      - 'deploy/netlify/site/**/index.html'
      - 'deploy/netlify/site/p2lrn.js'
      - 'deploy/netlify/site/studio/studio.js'
      - 'deploy/netlify/site/demo/viewer.js'
      - 'deploy/netlify/site/analytics/demo.js'
      - 'deploy/netlify/site/site.webmanifest'
      - '!deploy/netlify/site/en/**'
      - 'scripts/generate-site-english.mjs'
      - 'scripts/browser-smoke-p2lrn-i18n.mjs'
      - 'scripts/audit-site-editorial-seo.mjs'
      - 'deploy/netlify/site/p2lrn.css'
      - 'scripts/verify-site-bilingual.mjs'
      - 'scripts/site-i18n-ast.mjs'
      - 'scripts/test-site-i18n-ast.mjs'
      - 'scripts/test-site-ui-locales.mjs'
      - 'scripts/site-en-runtime-reviewed.json'
      - 'packages/toolkit/web/studio/**'
      - 'packages/analytics/src/locale.js'
      - 'packages/analytics/src/p2lrn-analytics.js'
      # Workflow-only edits can be checked via workflow_dispatch without regenerating English.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2lrn-site-i18n-main
  cancel-in-progress: true

jobs:
  docs-visual-qa:
    name: Verify 24 ES/EN guides at desktop and mobile widths in real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned browser and required Linux dependencies
        run: |
          npm install --prefix .p2lrn-i18n-ci --ignore-scripts --no-audit --no-fund --no-save --package-lock=false playwright-core@1.64.1 axe-core@4.10.3
          node .p2lrn-i18n-ci/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify bilingual editorial parity and locale-specific JS contracts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false cheerio@1.2.0 acorn@8.19.0
          node --test scripts/test-site-i18n-ast.mjs scripts/test-site-ui-locales.mjs
          node scripts/verify-site-bilingual.mjs
      - name: Audit all 144 ES/EN pages for editorial quality, structure, language and SEO intent
        run: node scripts/audit-site-editorial-seo.mjs
      - name: Validate all 48 real browser views, language navigation and teacher/developer paths
        run: node scripts/browser-smoke-p2lrn-i18n.mjs --docs-only
      - name: Preserve raw Chromium screenshots and JSON evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2lrn-docs-24-pages-48-views-chromium
          path: .p2lrn-i18n-ci/evidence/
          if-no-files-found: warn
          retention-days: 7

  generate-english-site:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install isolated translation tooling
        shell: powershell
        run: |
          if (-not (Test-Path package.json)) {
            '{"private":true,"type":"module"}' | Set-Content -Encoding UTF8 package.json
          }
          npm install --no-save --package-lock=false @huggingface/transformers@4.3.2 cheerio@1.2.0 acorn@8.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check bilingual build scripts
        shell: powershell
        run: |
          node --check deploy/netlify/build-site.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check deploy/netlify/browser-site-revision.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/generate-site-english.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/verify-site-bilingual.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test JavaScript i18n walker
        shell: powershell
        run: |
          node --check scripts/site-i18n-ast.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-site-i18n-ast.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-site-ui-locales.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate complete English mirror
        shell: powershell
        env:
          HF_HOME: ${{ runner.temp }}\p2lrn-huggingface
          P2LRN_I18N_PROVIDER: local
          P2LRN_I18N_CONCURRENCY: '1'
        run: |
          node scripts/generate-site-english.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-site-bilingual.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit generated English site
        shell: powershell
        run: |
          git add -- deploy/netlify/site/en scripts/site-en-translations.json
          $changes = git diff --cached --name-only
          if (-not $changes) {
            Write-Output 'English mirror already matches the Spanish source.'
            exit 0
          }
          git fetch origin main
          $head = git rev-parse HEAD
          $remote = git rev-parse origin/main
          if ($head -ne $remote) {
            throw 'main advanced while the English mirror was generated; the next main run must regenerate from the new source.'
          }
          git config user.name 'p2lrn-i18n-bot'
          git config user.email 'p2lrn-i18n-bot@users.noreply.github.com'
          git commit -m 'site(i18n): refresh complete English mirror [skip i18n]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
