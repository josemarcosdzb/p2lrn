name: P2LRN Bilingual Website
# The generated translation cache is versioned but does not retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      # Only authored source files actually read by the Spanish-to-English generator.
      # SEO/build scripts, styles, binaries, and generated /en pages are not translation inputs.
      - 'deploy/netlify/site/index.html'
      - 'deploy/netlify/site/**/index.html'
      - 'deploy/netlify/site/p2lrn.js'
      - 'deploy/netlify/site/studio/studio.js'
      - 'deploy/netlify/site/demo/viewer.js'
      - 'deploy/netlify/site/analytics/demo.js'
      - 'deploy/netlify/site/site.webmanifest'
      - '!deploy/netlify/site/en/**'
      # Manually reviewed English Studio is not generated, but changes must still run browser QA.
      - 'deploy/netlify/site/en/studio/index.html'
      - 'deploy/netlify/site/en/studio/studio.js'
      # Reviewed English Studio guide is independent editorial source: validate it too.
      - 'deploy/netlify/site/en/docs/studio/index.html'
      # Manually restored English LMS guides must never bypass bilingual QA.
      - 'deploy/netlify/site/en/docs/conectores/**'
      - 'deploy/netlify/site/en/docs/troubleshooting/**'
      - 'deploy/netlify/site/assets/studio-guide/guide.css'
      - 'scripts/generate-site-english.mjs'
      - 'scripts/browser-smoke-p2lrn-i18n.mjs'
      - 'scripts/audit-site-editorial-seo.mjs'
      - 'scripts/verify-site-media-seo.mjs'
      # A release build can change the bilingual output even without new translations.
      - 'deploy/netlify/build-site.mjs'
      # LMS updates can change documented end-to-end course and grade behavior.
      - 'integration/lms/lti-store.mjs'
      - 'deploy/netlify/site-seo-a11y.mjs'
      - '.github/workflows/p2lrn-site-i18n.yml'
      - 'deploy/netlify/site/p2lrn.css'
      - 'scripts/verify-site-bilingual.mjs'
      - 'scripts/site-i18n-ast.mjs'
      - 'scripts/test-site-i18n-ast.mjs'
      - 'scripts/test-site-ui-locales.mjs'
      - 'scripts/site-en-runtime-reviewed.json'
      - 'packages/toolkit/web/studio/**'
      - 'packages/analytics/src/locale.js'
      - 'packages/analytics/src/p2lrn-analytics.js'
      # Workflow-only edits can be checked via workflow_dispatch without regenerating English.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2lrn-site-i18n-main
  cancel-in-progress: true

jobs:
  docs-visual-qa:
    # Validate the committed ES/EN website in actual Chromium; generation never edits it during push.
    name: Verify 24 ES/EN guides at desktop and mobile widths in real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned browser and required Linux dependencies
        run: |
          npm install --prefix .p2lrn-i18n-ci --ignore-scripts --no-audit --no-fund --no-save --package-lock=false playwright-core@1.64.1 axe-core@4.10.3
          node .p2lrn-i18n-ci/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Validate all 48 real browser views, language navigation and teacher/developer paths
        if: always()
        run: node scripts/browser-smoke-p2lrn-i18n.mjs --docs-only
      - name: Audit WCAG 2.2 A/AA, keyboard entry, media alternatives and overflow on every public ES/EN page
        if: always()
        run: node scripts/browser-smoke-p2lrn-i18n.mjs --site-a11y
      - name: Audit all 144 ES/EN pages for editorial quality, structure, language and SEO intent
        if: always()
        run: node scripts/audit-site-editorial-seo.mjs --strict
      # CANDIDATE gate only. Netlify publication is frozen: public p2lrn.org may
      # legitimately be older than this Git SHA. Never gate this job on live sitemap.
      # POST-DEPLOY live acceptance: see deploy/netlify/README.md.
      - name: Verify candidate images and videos in the generated bilingual sitemap
        if: always()
        run: node scripts/verify-site-media-seo.mjs
      - name: Verify bilingual editorial parity and locale-specific JS contracts
        if: always()
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false cheerio@1.2.0 acorn@8.19.0
          node --test scripts/test-site-i18n-ast.mjs scripts/test-site-ui-locales.mjs
          node scripts/verify-site-bilingual.mjs
      - name: Capture real ES/EN Studio multipart size field, validate labels and invalid values
        if: always()
        run: node scripts/browser-smoke-p2lrn-i18n.mjs --capture-multipart
      - name: Capture real Studio fill-in-the-blanks with draggable words and distractors
        if: always()
        run: node scripts/browser-smoke-p2lrn-i18n.mjs --capture-fill-blanks
      - name: Preserve raw Chromium screenshots and JSON evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2lrn-docs-24-pages-48-views-chromium
          path: .p2lrn-i18n-ci/evidence/
          if-no-files-found: warn
          retention-days: 7

  generate-english-site:
    # English regeneration is explicit, reviewable and never auto-committed during CI.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install isolated translation tooling
        shell: powershell
        run: |
          if (-not (Test-Path package.json)) {
            '{"private":true,"type":"module"}' | Set-Content -Encoding UTF8 package.json
          }
          npm install --no-save --package-lock=false @huggingface/transformers@4.3.2 cheerio@1.2.0 acorn@8.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check bilingual build scripts
        shell: powershell
        run: |
          node --check deploy/netlify/build-site.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check deploy/netlify/browser-site-revision.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/generate-site-english.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/verify-site-bilingual.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test JavaScript i18n walker
        shell: powershell
        run: |
          node --check scripts/site-i18n-ast.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-site-i18n-ast.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-site-ui-locales.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate complete English mirror
        shell: powershell
        env:
          HF_HOME: ${{ runner.temp }}\p2lrn-huggingface
          P2LRN_I18N_PROVIDER: local
          P2LRN_I18N_CONCURRENCY: '1'
        run: |
          node scripts/generate-site-english.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-site-bilingual.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # CI validates one immutable source revision. Generated translations must
      # be reviewed and committed before testing, never published after QA.
      - name: Require generated English to match the exact candidate commit
        shell: powershell
        run: |
          git diff --exit-code -- deploy/netlify/site/en scripts/site-en-translations.json
          if ($LASTEXITCODE -ne 0) {
            throw 'English generation changed candidate bytes. Commit the generated mirror and validate that new SHA.'
          }
