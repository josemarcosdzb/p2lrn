name: P2LRN PR Hosted Security Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p2lrn-hosted-pr-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify security source invariants
        run: |
          node --test scripts/test-security-hardening.test.mjs
          node scripts/verify-site-security.mjs
          node scripts/verify-contact-security.mjs
