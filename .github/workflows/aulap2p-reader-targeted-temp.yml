name: AulaP2P Reader targeted validation
# generation: 3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aulap2p-reader-targeted-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aulap2p-reader-targeted-temp
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Validate AulaP2P universal snapshot without touching working tree
        shell: bash
        run: |
          set -Eeuo pipefail
          REPO=/home/usuario/aulap2p-main
          test -d "$REPO/.git"
          git -C "$REPO" fetch origin universal
          SHA="$(git -C "$REPO" rev-parse origin/universal)"
          echo "AULAP2P_UNIVERSAL_SHA=$SHA"

          ROOT="/tmp/aulap2p-reader-targeted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          git -C "$REPO" archive "$SHA" | tar -x -C "$ROOT"

          export NVM_DIR="$HOME/.nvm"
          set +u
          . "$NVM_DIR/nvm.sh"
          set -u
          nvm use 22

          cd "$ROOT/backend"
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npx prisma generate
          npx jest             cursos/importacion/importacion-formatos-archivo.spec.ts             cursos/importacion/pptx-placement.spec.ts             cursos/importacion/importacion-pdf-pruebas.spec.ts             cursos/importacion/resolucion/importacion-evidencias-regresion.spec.ts             cursos/importacion/resolucion/resolvedor-estructura-evidencias.service.spec.ts             cursos/importacion/lectura/extractores/extractor-separacion-estructurada.regression.spec.ts             --runInBand --ci --no-cache

          echo "AULAP2P_READER_TARGETED_OK=$SHA"
