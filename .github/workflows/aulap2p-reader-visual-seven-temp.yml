name: AulaP2P Reader visual seven documents

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aulap2p-reader-visual-seven-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aulap2p-reader-visual-seven-temp
  cancel-in-progress: true

jobs:
  visual:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Run local universal main and latest through real UI
        shell: bash
        run: |
          set -Euo pipefail
          REPO=/home/usuario/aulap2p-main
          test -d "$REPO/.git"
          git -C "$REPO" fetch origin main universal

          CONTROLLER="/tmp/aulap2p-reader-visual-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$CONTROLLER"
          mkdir -p "$CONTROLLER"
          git -C "$REPO" archive origin/universal | tar -x -C "$CONTROLLER"

          export NVM_DIR="$HOME/.nvm"
          set +u
          . "$NVM_DIR/nvm.sh"
          set -u
          nvm use 22

          export GITHUB_WORKSPACE="$CONTROLLER"
          export RUNNER_TEMP="/tmp/aulap2p-reader-visual-runs"
          export GITHUB_REPOSITORY="josemarcosfrodo/aulap2p"
          export LOCAL_REPO="$REPO"
          mkdir -p "$RUNNER_TEMP"

          EVIDENCE="$GITHUB_WORKSPACE/.visual-evidence"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

          failures=0
          for variant in local-universal main latest-universal; do
            echo "===== VISUAL VARIANT $variant ====="
            export READER_CORPUS_VARIANT="$variant"
            export READER_CORPUS_ROOT_OVERRIDE="$RUNNER_TEMP/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$variant"
            export READER_CORPUS_ARTIFACTS_OVERRIDE="$READER_CORPUS_ROOT_OVERRIDE/artifacts"
            unset GITHUB_ENV || true

            set +e
            bash "$CONTROLLER/scripts/ci/run-reader-corpus-visual-postgres.sh"
            rc=$?
            set -e

            mkdir -p "$EVIDENCE/$variant"
            if [ -d "$READER_CORPUS_ARTIFACTS_OVERRIDE" ]; then
              rsync -a --delete "$READER_CORPUS_ARTIFACTS_OVERRIDE/" "$EVIDENCE/$variant/"
            fi
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done

          echo "===== RESULTS ====="
          for variant in local-universal main latest-universal; do
            echo "--- $variant source ---"
            cat "$EVIDENCE/$variant/source-state.txt" 2>/dev/null || true
            echo "--- $variant results ---"
            cat "$EVIDENCE/$variant/results.tsv" 2>/dev/null || true
          done

          exit "$failures"

      - name: Upload screenshots and structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aulap2p-reader-visual-seven-${{ github.run_id }}
          path: /tmp/aulap2p-reader-visual-controller-${{ github.run_id }}-${{ github.run_attempt }}/.visual-evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
