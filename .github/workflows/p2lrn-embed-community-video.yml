name: Embed licensed H5P video with pinned SHA-256
on:
  push:
    branches: [mejorastudio]
    paths:
      - 'scripts/embed-community-h5p-video.mjs'
      - '.github/workflows/p2lrn-embed-community-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: licensed-h5p-video-import-mejorastudio
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mejorastudio
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source and compile derivative without executing media
        run: |
          node --check scripts/embed-community-h5p-video.mjs
          node scripts/embed-community-h5p-video.mjs
          node scripts/verify-community-samples.mjs
      - name: Commit verified derivative to existing branch only
        shell: bash
        run: |
          set -euo pipefail
          git add examples/canonical/external/free/h5p-interactive-video.p2lrn examples/canonical/external/free/provenance.json
          if git diff --cached --quiet; then
            echo "Already derived; no changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(samples): embed CC BY 4.0 video and upstream archive in H5P offline demo'
          git push origin HEAD:mejorastudio
