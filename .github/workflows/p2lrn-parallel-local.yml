name: P2LRN Parallel Local Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2lrn-parallel-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer-runtime:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build toolkit
        working-directory: packages/toolkit
        run: |
          npm install --ignore-scripts --no-audit --no-fund --include=dev
          npm run build
      - name: Build Player runtime
        run: node packages/player/scripts/build-dist.mjs
      - name: Prepare local viewer fixture
        shell: powershell
        run: |
          node deploy/netlify/build-cdn.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -Force deploy/netlify/site/* .netlify-cdn/
          New-Item -ItemType Directory -Force .netlify-cdn/examples/canonical | Out-Null
          Copy-Item -Recurse -Force examples/canonical/* .netlify-cdn/examples/canonical/
          Copy-Item -Force .netlify-cdn/player/current/dist/p2lrn-sw.js .netlify-cdn/p2lrn-sw.js
      - name: Verify viewer runtimes and responsive layout locally
        run: node scripts/verify-local-viewer.mjs

  npm-browser:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build toolkit
        working-directory: packages/toolkit
        run: |
          npm install --ignore-scripts --no-audit --no-fund --include=dev
          npm run build
      - name: Verify installed npm tarballs
        run: node scripts/verify-npm-pack.mjs
      - name: Browser smoke from installed npm tarballs
        run: node scripts/verify-browser-from-npm.mjs

  canonical-production:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build toolkit
        working-directory: packages/toolkit
        run: |
          npm install --ignore-scripts --no-audit --no-fund --include=dev
          npm run build
      - name: Validate canonical authoring round-trip
        working-directory: packages/toolkit
        run: node --test test/authoring-roundtrip.test.mjs
      - name: Build production site locally only
        run: node deploy/netlify/build-site.mjs
      - name: Verify npm/CDN byte identity locally
        run: node scripts/verify-distribution-identity.mjs
