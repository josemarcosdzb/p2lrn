name: P2LRN Local 4183 Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-local-4183.ps1'
      - '.github/workflows/p2lrn-local-4183.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-local-4183:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 12
    steps:
      - name: Checkout current main without touching local site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Inspect localhost 4183 files and serving process (read-only)
        shell: powershell
        run: ./scripts/audit-local-4183.ps1
