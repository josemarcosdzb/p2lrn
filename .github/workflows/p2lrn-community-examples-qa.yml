name: P2LRN Community Examples QA

on:
  push:
    branches: [mejorastudio]
    paths:
      - 'examples/canonical/external/free/**'
      - 'scripts/verify-community-samples.mjs'
      - '.github/workflows/p2lrn-community-examples-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-community-examples:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate each authentic source, preserved ZIP and P2LRN integrity
        shell: powershell
        run: |
          node --check scripts/verify-community-samples.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-community-samples.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }