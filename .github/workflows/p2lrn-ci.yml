name: P2LRN product CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2lrn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Toolkit, Player and generated artifacts
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify generated Creator schema
        run: npm run check:creator-schema --workspace @p2lrn/toolkit

      - name: Build and test toolkit
        run: npm test --workspace @p2lrn/toolkit

      - name: Build and test document reader
        run: npm test --workspace @p2lrn/document-reader

      - name: Rebuild Player distribution from canonical runtime
        run: node packages/toolkit/dist/tools/build-web-sdk.js --root packages/toolkit --output packages/player/dist

      - name: Validate Editor syntax and end-to-end authoring host
        run: |
          node --check apps/editor/server.mjs
          node --check apps/editor/public/editor.js
          npm test --workspace @p2lrn/editor

      - name: Test Player distribution
        working-directory: packages/player
        env:
          PATH: ${{ github.workspace }}/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: node --test test/*.test.mjs

      - name: Verify generated files are committed and reproducible
        run: git diff --exit-code -- packages/toolkit/src/core/creator-project-schema.ts packages/player/dist
