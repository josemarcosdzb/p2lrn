name: P2LRN CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/toolkit/**'
      - 'packages/player/**'
      - 'packages/h5p-libraries/**'
      - 'scripts/verify-npm-pack.mjs'
      - 'scripts/verify-browser-from-npm.mjs'
      - 'scripts/verify-distribution-identity.mjs'
      - 'scripts/set-version.mjs'
      - 'deploy/netlify/**'
      - 'netlify.toml'
      - '.github/workflows/p2lrn-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/toolkit/**'
      - 'packages/player/**'
      - 'packages/h5p-libraries/**'
      - 'scripts/verify-npm-pack.mjs'
      - 'scripts/verify-browser-from-npm.mjs'
      - 'scripts/verify-distribution-identity.mjs'
      - 'scripts/set-version.mjs'
      - 'deploy/netlify/**'
      - 'netlify.toml'
      - '.github/workflows/p2lrn-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2lrn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolkit-and-cdn:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Compile and test toolkit
        working-directory: packages/toolkit
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.6.3
          npm test

      - name: Check browser module syntax
        run: |
          find packages/toolkit/web packages/toolkit/web-sdk-src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check packages/player/scripts/build-dist.mjs
          node --check packages/h5p-libraries/scripts/build.mjs
          node --check scripts/verify-npm-pack.mjs
          node --check scripts/verify-browser-from-npm.mjs
          node --check scripts/verify-distribution-identity.mjs
          node --check scripts/set-version.mjs
          node --check deploy/netlify/build-cdn.mjs

      - name: Verify npm tarballs as installed packages
        run: node scripts/verify-npm-pack.mjs

      - name: Browser smoke from installed npm tarballs
        run: node scripts/verify-browser-from-npm.mjs

      - name: Build Netlify CDN
        run: node deploy/netlify/build-cdn.mjs

      - name: Verify npm/CDN byte identity
        run: node scripts/verify-distribution-identity.mjs

      - name: Verify generated runtime
        run: |
          VERSION="$(node -p "require('./packages/player/package.json').version")"
          test -f ".netlify-cdn/player/$VERSION/dist/p2lrn.js"
          test -f ".netlify-cdn/player/$VERSION/dist/runtime-host/h5p.html"
          test -f ".netlify-cdn/player/$VERSION/dist/runtime-host/scorm.html"
          test -s ".netlify-cdn/player/$VERSION/dist/runtime-host/assets/frame.bundle.js"
          test -s ".netlify-cdn/player/$VERSION/dist/runtime-host/assets/styles/h5p.css"
          test -f ".netlify-cdn/player/$VERSION/dist/runtime-host/h5p-libraries/H5P.Crossword-0.5/library.json"
          test -f ".netlify-cdn/player/$VERSION/dist/runtime-host/h5p-libraries/H5P.BranchingScenario-1.8/library.json"
          grep -q "\"webSdkVersion\": \"$VERSION\"" ".netlify-cdn/player/$VERSION/dist/release.json"
          grep -q "\"sharedLibraryMode\": \"bundled-npm-artifact\"" ".netlify-cdn/index.json"
