name: P2LRN Portable Security and Release Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2lrn-portable-verification.yml'
      - 'packages/**'
      - 'deploy/netlify/**'
      - 'scripts/**'
      - 'integration/lms/**'
  workflow_dispatch:
    inputs:
      npm_provider_only:
        description: 'Run only npm-packed Provider installation, startup, CLI and HTTP smoke'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # A manual npm-only smoke must not be cancelled by unrelated main pushes.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_provider_only && 'p2lrn-portable-npm-only' || 'p2lrn-portable-main' }}
  cancel-in-progress: true

jobs:
  postgres-live:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: LTI real PostgreSQL database, persistence and AGS
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p2lrn_test
          POSTGRES_PASSWORD: p2lrn_test_only
          POSTGRES_DB: p2lrn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2lrn_test -d p2lrn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      P2LRN_TEST_POSTGRES_URL: postgres://p2lrn_test:p2lrn_test_only@127.0.0.1:5432/p2lrn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install native SQL drivers (never use SQLite as fallback)
        working-directory: integration/lms
        run: npm install --ignore-scripts --no-audit --no-fund --no-save ../../packages/toolkit ../../packages/player
      - name: Exercise genuine PostgreSQL transactions, session reload and grade outbox
        run: |
          node --test integration/lms/lti-postgres-live.test.mjs
          node --test integration/lms/lti-installer-live.test.mjs
          P2LRN_TEST_LTI_ASYNC_ENABLE=YES P2LRN_TEST_LTI_ASYNC_ENGINE=postgres node --test integration/lms/lti-async-sql-live.test.mjs
      - name: Build Player and Toolkit for complete signed HTTP LTI regression on PostgreSQL
        run: |
          npm ci --prefix packages/toolkit --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/toolkit
          node packages/player/scripts/build-dist.mjs
      - name: Signed LTI 1.3 HTTP E2E with external PostgreSQL (no mocks for persistence)
        env:
          P2LRN_TEST_LTI_ASYNC_ENABLE: 'YES'
          P2LRN_TEST_LTI_ASYNC_ENGINE: postgres
        run: node --test integration/lms/lti-server.test.mjs

  mysql-mariadb-live:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: LTI real MySQL 8.4 and MariaDB 11.8 persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p2lrn_test_root_only
          MYSQL_DATABASE: p2lrn_test
          MYSQL_USER: p2lrn_test
          MYSQL_PASSWORD: p2lrn_test_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 18
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p2lrn_test_root_only
          MARIADB_DATABASE: p2lrn_test
          MARIADB_USER: p2lrn_test
          MARIADB_PASSWORD: p2lrn_test_only
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 18
    env:
      P2LRN_TEST_MYSQL_URL: mysql://p2lrn_test:p2lrn_test_only@127.0.0.1:3307/p2lrn_test
      P2LRN_TEST_MARIADB_URL: mariadb://p2lrn_test:p2lrn_test_only@127.0.0.1:3308/p2lrn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install native SQL drivers
        working-directory: integration/lms
        run: npm install --ignore-scripts --no-audit --no-fund --no-save ../../packages/toolkit ../../packages/player
      - name: Run genuine MySQL and MariaDB storage, grades and restart checks
        run: |
          node --test integration/lms/lti-mysql-live.test.mjs
          node --test integration/lms/lti-installer-live.test.mjs
          P2LRN_TEST_LTI_ASYNC_ENABLE=YES P2LRN_TEST_LTI_ASYNC_ENGINE=mysql node --test integration/lms/lti-async-sql-live.test.mjs
          P2LRN_TEST_LTI_ASYNC_ENABLE=YES P2LRN_TEST_LTI_ASYNC_ENGINE=mariadb node --test integration/lms/lti-async-sql-live.test.mjs

  sqlserver-live:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: LTI real Microsoft SQL Server 2022 database and AGS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'P2lrn_Test_2026_Secure!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval 8s --health-timeout 5s --health-retries 30
    env:
      P2LRN_TEST_SQLSERVER_URL: 'sqlserver://sa:P2lrn_Test_2026_Secure%21@127.0.0.1:1433/p2lrn_test?encrypt=false&trustServerCertificate=true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Microsoft SQL Server driver
        working-directory: integration/lms
        run: npm install --ignore-scripts --no-audit --no-fund --no-save ../../packages/toolkit ../../packages/player
      - name: Create and exercise real SQL Server database, courses, sessions and approved grades
        run: |
          node --test integration/lms/lti-sqlserver-live.test.mjs
          node --test integration/lms/lti-installer-live.test.mjs
          P2LRN_TEST_LTI_ASYNC_ENABLE=YES P2LRN_TEST_LTI_ASYNC_ENGINE=sqlserver node --test integration/lms/lti-async-sql-live.test.mjs

  toolkit-security:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: Toolkit ZIP, Player runtime security and Creator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build Toolkit with exact locked dependencies
        working-directory: packages/toolkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Inspect actual external demo launch members (cmi5, SCORM, QTI, H5P)
        run: node scripts/inspect-external-visual-qa.mjs
      - name: Syntax-check visual browser contract before expensive release builds
        run: node --check scripts/browser-external-format-visual-qa.mjs
      - name: Make official Toolkit available for verifying uploaded external packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2lrn-official-toolkit-converter
          path: |
            packages/toolkit/dist/
            packages/toolkit/package.json
          retention-days: 2
          if-no-files-found: error
      - name: Run full Toolkit security and regression suite
        working-directory: packages/toolkit
        run: node --test --test-concurrency=2 test/*.test.mjs
      - name: Verify cross-format messages and browser ZIP protections explicitly
        run: |
          node --test packages/toolkit/test/browser-zip-decompression-security.test.mjs
          node --test packages/toolkit/test/player-untrusted-json.test.mjs
          node --test packages/toolkit/test/runtime-message-security.test.mjs
          node --test packages/toolkit/test/creator-import-disk-path-security.test.mjs

  studio-analytics-player:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: Studio, Analytics, Player and host boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compile Toolkit dependency
        working-directory: packages/toolkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Analytics data isolation, role checks and privacy
        run: |
          node --test --test-concurrency=2 packages/analytics/test/*.test.mjs
          node packages/analytics/scripts/build-dist.mjs
          node scripts/verify-analytics.mjs
      - name: Build the Player distribution before testing its published entry points
        run: node packages/player/scripts/build-dist.mjs
      - name: Player score receipts, collaboration and runtime boundaries
        run: |
          node --test --test-concurrency=2 packages/player/test/*.test.mjs
          node --test packages/toolkit/test/collaboration-http.test.mjs
      - name: LTI 1.3 authentication, session isolation, grades and HTTP security
        run: |
          node --test integration/lms/lti-provider.test.mjs integration/lms/lti-store.test.mjs
          node --test integration/lms/lti-canvas-registration.test.mjs integration/lms/lti-ags.test.mjs integration/lms/lti-nrps.test.mjs
          node --test integration/lms/lti-server.test.mjs integration/lms/lti-admin-auth.test.mjs integration/lms/lti-installer.test.mjs
          node --test integration/lms/lti-async-store.test.mjs integration/lms/lti-test-sql-guard.test.mjs integration/lms/lti-legacy.test.mjs
          node --test scripts/interoperability/real-lms-classroom-contract.test.mjs
          node --check scripts/interoperability/verify-real-lms-classroom.mjs
          node --test integration/lms/lti-safe-fetch.test.mjs integration/lms/lti-content-scope.test.mjs
          node --test scripts/test-contact-turnstile.test.mjs scripts/test-contact-frontend.test.mjs
          node scripts/verify-contact-security.mjs
      - name: Studio security and integration regression
        run: |
          node --test --test-concurrency=2 packages/studio/test/*.test.mjs
          node --test --test-concurrency=2 packages/toolkit/test/studio-server-save.test.mjs
      - name: TypeScript and JavaScript syntax checks
        run: |
          node --check packages/toolkit/web/zip-source.js
          node --check packages/toolkit/web/runtime-message-security.js
          node --check packages/toolkit/web/p2lrn-player.js
          node --check packages/analytics/server/dataset-http.mjs
          node --check packages/studio/src/p2lrn-studio.js
          node --check deploy/netlify/site/studio/studio.js

  cdn-release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: Build site, verify CDN SRI, headers and npm byte identity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: false
      - name: Build Toolkit dependency and audit source
        working-directory: packages/toolkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Check cross-package release versions
        run: node scripts/check-release-alignment.mjs
      - name: Generate real CDN and public website
        run: node deploy/netlify/build-site.mjs
      - name: Verify published artifacts use exact SHA-384 SRI
        run: node scripts/verify-cdn-sri.mjs
      - name: Prepare and install inspected npm tarballs for byte identity comparison
        run: node scripts/verify-npm-pack.mjs
      - name: Verify package/CDN byte identity and sourcemaps
        run: node scripts/verify-distribution-identity.mjs
      - name: Verify website links, headers and document accessibility
        run: |
          node scripts/verify-built-doc-links.mjs
          node scripts/verify-site-seo-a11y.mjs

  npm-pack-security:
    name: Stage all NPM tarballs and inspect packaged files
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build Toolkit from lockfile
        working-directory: packages/toolkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify NPM packaging, manifests and local tarballs (do not publish)
        run: node scripts/verify-npm-pack.mjs
      - name: Install the real LTI npm tarball into a clean project and exercise the HTTP server
        run: node scripts/verify-lti-npm-install.mjs
      - name: Verify npm registry state without changing tags
        run: node scripts/check-public-npm-registry.mjs

  windows-hosted-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.npm_provider_only }}
    name: Windows hosted security, native build and package/CDN parity
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: false
      - name: Compile Toolkit with its locked dependencies on Windows
        working-directory: packages/toolkit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows-specific path, framework, runtime and grades safety
        run: |
          node --test packages/toolkit/test/creator-import-disk-path-security.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/studio/test/multiframework-security.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/toolkit/test/browser-zip-decompression-security.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/toolkit/test/runtime-message-security.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/player/test/trusted-result-receipt.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/analytics/test/secure-dataset-http.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and install actual npm tarballs in Windows
        run: |
          node scripts/verify-npm-pack.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows LTI console installation, RSA/JWKS and credential recovery
        run: |
          node --test integration/lms/lti-installer.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Windows native launcher and complete CDN site
        run: |
          node deploy/netlify/build-site.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned browser harness for external educational formats
        run: |
          npm install --prefix .p2lrn-i18n-ci --no-save --package-lock=false --ignore-scripts playwright-core@1.64.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/ensure-browser-windows.ps1
      - name: Verify real cmi5, SCORM and QTI content in Chrome/Edge
        run: |
          node scripts/browser-external-format-visual-qa.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real 3D assembly movement, drag persistence and other 3D games in Chrome/Edge
        env:
          P2LRN_QUEST3D_ONLY: '1'
          P2LRN_QUEST3D_OUTPUT_DIR: .visual-evidence/quest3d-hosted
        run: |
          node --check scripts/verify-local-viewer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-local-viewer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete Studio/Player browser E2E and connected release matrix
        run: |
          node scripts/verify-local-viewer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-connected-e2e-matrix.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve connected browser release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2lrn-connected-browser-release
          path: |
            .visual-evidence/collaboration-two-player.png
            .visual-evidence/shared-resource-digest.png
            .connected-e2e-matrix.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve genuine 3D browser and assembly screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2lrn-assembly-3d-browser-qa
          path: .visual-evidence/quest3d-hosted/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve external format screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2lrn-external-format-visual-qa
          path: .p2lrn-external-visual-qa/
          if-no-files-found: warn
      - name: Verify SRI hashes, browser headers and npm/CDN identity on Windows
        run: |
          node scripts/verify-cdn-sri.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-distribution-identity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-built-doc-links.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
