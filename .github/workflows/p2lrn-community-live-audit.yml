name: P2LRN Public Community Catalog Audit

on:
  push:
    branches: [mejorastudio]
    paths:
      - 'scripts/check-community-public-web.mjs'
      - '.github/workflows/p2lrn-community-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-catalog:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mejorastudio
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check public site, bilingual gallery and course URLs
        shell: powershell
        run: |
          node scripts/check-community-public-web.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
