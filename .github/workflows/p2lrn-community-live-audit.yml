name: P2LRN Public Community Catalog Audit

on:
  push:
    branches: [mejorastudio]
    paths:
      - 'scripts/check-community-public-web.mjs'
      - '.github/workflows/p2lrn-community-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-catalog:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mejorastudio
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm production deployment and bilingual gallery on both hostnames
        shell: powershell
        run: |
          Write-Host "EXPECTED_MAIN_COMMIT=0880c98e319e738cac01e4e1e9d4d4cce979ea7d"
          for($attempt=1;$attempt -le 12;$attempt++){
            Write-Host "PUBLIC_AUDIT_ATTEMPT=$attempt"
            node scripts/check-community-public-web.mjs
            if($LASTEXITCODE -eq 0){
              Write-Host "PUBLIC_AUDIT_APPROVED=1"
              exit 0
            }
            if($attempt -lt 12){Start-Sleep -Seconds 20}
          }
          Write-Error 'Public catalog or gallery still unavailable; do not claim live certification'
          exit 1
