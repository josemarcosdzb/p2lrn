name: P2LRN Public CDN Browser Verification
on:
  push:
    branches: [main]
    paths:
      - 'deploy/netlify/site/deployment-verification.json'
      - 'scripts/verify-public-cdn.mjs'
      - '.github/workflows/p2lrn-public-cdn.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2lrn-public-cdn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-public-cdn:
    runs-on: [self-hosted, Windows, X64, p2lrn-windows]
    timeout-minutes: 20
    steps:
      - name: Checkout merged P2LRN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check deployed-CDN verifier syntax
        run: node --check scripts/verify-public-cdn.mjs
      - name: Verify live Netlify site and CDN with real downloads and Chrome
        env:
          P2LRN_PUBLIC_ORIGIN: https://p2lrn.netlify.app
        run: node scripts/verify-public-cdn.mjs
