[build]
  command = "node deploy/netlify/build-cdn.mjs"
  publish = ".netlify-cdn"

[build.environment]
  NODE_VERSION = "22"

# Runtime Web SDK: every URL contains the exact SDK version, so browser/CDN
# caching can safely be immutable.
[[headers]]
  for = "/player/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Public P2LRN package objects must also use immutable/versioned paths.
# Netlify owns Accept-Ranges, Content-Length and Content-Range; do not try
# to set those values manually. They are exposed here for cross-origin readers.
[[headers]]
  for = "/packages/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Expose-Headers = "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, immutable"
    Content-Type = "application/vnd.p2lrn+zip"
    X-Content-Type-Options = "nosniff"

# Discovery metadata may change on a later deploy and is not a runtime pin.
[[headers]]
  for = "/index.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/health.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
