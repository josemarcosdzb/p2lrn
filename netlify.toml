[build]
  # Release freeze: skip Git-triggered Netlify builds until explicitly lifted.
  # Exit code 0 skips a build; this does not disable manual build hooks.
  ignore = "exit 0"
  command = "node deploy/netlify/build-site.mjs"
  publish = ".netlify-cdn"

[build.environment]
  NODE_VERSION = "22"
  GO_VERSION = "1.26"

# Conventional favicon endpoint for crawlers and browsers.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 301
  force = true

# Redirect only the legacy hostname owned by this project, not arbitrary Netlify sites.
# The published _redirects repeats this host rule first to avoid path-rule precedence.
[[redirects]]
  from = "https://p2lrn.netlify.app/*"
  to = "https://p2lrn.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://p2lrn.netlify.app/*"
  to = "https://p2lrn.org/:splat"
  status = 301
  force = true

# Consolidated SEO pages: redirect permanently to the existing guides.
[[redirects]]
  from = "/crear-cuestionarios-interactivos/"
  to = "/docs/questionnaires/standard/#crear-cuestionarios-online"
  status = 301
  force = true

[[redirects]]
  from = "/en/crear-cuestionarios-interactivos/"
  to = "/en/docs/questionnaires/standard/#create-online-quizzes"
  status = 301
  force = true

[[redirects]]
  from = "/actividades-educativas-interactivas/"
  to = "/docs/questionnaires/#juegos-educativos-2d"
  status = 301
  force = true

[[redirects]]
  from = "/en/actividades-educativas-interactivas/"
  to = "/en/docs/questionnaires/#2d-educational-games"
  status = 301
  force = true

[[redirects]]
  from = "/crear-cursos-con-ia/"
  to = "/skills/#guia-ia"
  status = 301
  force = true

[[redirects]]
  from = "/en/crear-cursos-con-ia/"
  to = "/en/skills/#ai-guide"
  status = 301
  force = true

[[redirects]]
  from = "/scorm-moodle-lms/"
