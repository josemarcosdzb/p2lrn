[build]
  command = "node deploy/netlify/build-site.mjs"
  publish = ".netlify-cdn"

[build.environment]
  NODE_VERSION = "22"
  GO_VERSION = "1.26"

# Conventional favicon endpoint for crawlers and browsers.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 301
  force = true

# Public legacy hostname always redirects to the primary P2LRN domain.
[[redirects]]
  from = "https://p2lrn.netlify.app/*"
  to = "https://p2lrn.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://p2lrn.netlify.app/*"
  to = "https://p2lrn.org/:splat"
  status = 301
  force = true

# Consolidated SEO pages: redirect permanently to the existing guides.
[[redirects]]
  from = "/crear-cuestionarios-interactivos/"
  to = "/docs/questionnaires/standard/#crear-cuestionarios-online"
  status = 301
  force = true

[[redirects]]
  from = "/en/crear-cuestionarios-interactivos/"
  to = "/en/docs/questionnaires/standard/#crear-cuestionarios-online"
  status = 301
  force = true

[[redirects]]
  from = "/actividades-educativas-interactivas/"
  to = "/docs/questionnaires/#juegos-educativos-2d"
  status = 301
  force = true

[[redirects]]
  from = "/en/actividades-educativas-interactivas/"
  to = "/en/docs/questionnaires/#juegos-educativos-2d"
  status = 301
  force = true

[[redirects]]
  from = "/crear-cursos-con-ia/"
  to = "/skills/#guia-ia"
  status = 301
  force = true

[[redirects]]
  from = "/en/crear-cursos-con-ia/"
  to = "/en/skills/#guia-ia"
  status = 301
  force = true

[[redirects]]
  from = "/scorm-moodle-lms/"
  to = "/docs/compatibilidad/#scorm-lms"
  status = 301
  force = true

[[redirects]]
  from = "/en/scorm-moodle-lms/"
  to = "/en/docs/compatibilidad/#scorm-lms"
  status = 301
  force = true

# Historical IA documentation paths now point to the corresponding section
# in the single canonical guide. Force redirects even when legacy HTML exists,
# and preserve working links shared before the navigation was reorganized.
[[redirects]]
  from = "/docs/conectores/gemini/"
  to = "/docs/conectores/ia/#gemini"
  status = 301
  force = true

[[redirects]]
  from = "/docs/conectores/skills/"
  to = "/docs/conectores/ia/#crear-cursos"
  status = 301
  force = true

[[redirects]]
  from = "/docs/conectores/local/"
  to = "/docs/conectores/ia/#conectar-ordenador"
  status = 301
  force = true

# English mirrors of the historical AI documentation redirects.
[[redirects]]
  from = "/en/docs/conectores/gemini/"
  to = "/en/docs/conectores/ia/#gemini"
  status = 301
  force = true

[[redirects]]
  from = "/en/docs/conectores/skills/"
  to = "/en/docs/conectores/ia/#crear-cursos"
  status = 301
  force = true

[[redirects]]
  from = "/en/docs/conectores/local/"
  to = "/en/docs/conectores/ia/#conectar-ordenador"
  status = 301
  force = true
